्या बैठकीत नगराध्यक्षांच्या समस्या जाणून घेत शिंदे यांनी त्यांना मार्गदर्शन केले. मात्र, ठाकरे गटाच्या पारकरांची उपस्थिती या बैठकीतील सर्वाधिक चर्चेचा विषय ठरली. बैठक संपल्यानंतर पारकर तेथून निघून गेले. काही तासांनी त्यांच्या उपस्थितीची माहिती सार्वजनिक झाली."}, {"t": "h", "x": "जून महिन्यात ठाकरेंना बसला होता मोठा धक्का"}, {"t": "p", "x": "जून २०२६ मध्ये ठाकरे गटाच्या नऊ खासदारांपैकी सहा खासदार शिंदेंच्या शिवसेनेकडे गेल्याने राज्याच्या राजकारणात मोठी उलथापालथ झाली होती."}, {"t": "p", "x": "त्यामध्ये पुढील खासदारांचा समावेश होता."}, {"t": "p", "x": "या पार्श्वभूमीवर संदेश पारकर यांच्या उपस्थितीचे राजकीय अर्थ लावले जात आहेत."}, {"t": "p", "x": "ठाकरे गट काय भूमिका घेणार?"}, {"t": "p", "x": "पारकर यांची उपस्थिती स्थानिक विकासाच्या प्रश्नांपुरती मर्यादित होती की त्यामागे काही राजकीय घडामोडी आहेत, हे अद्याप स्पष्ट झालेले नाही. त्यांच्या पक्षप्रवेशाचीही अधिकृत घोषणा झालेली नाही. त्यामुळे पारकर स्वतः आणि ठाकरे गट यासंदर्भात कोणती भूमिका मांडणार, याकडे राजकीय वर्तुळाचे लक्ष लागले आहे."}]}, {"id": "t7", "k": "text", "slug": "nvidia-jensen-huang-reinstated-president-ceo-board-decision", "t": "एनव्हिडियाचा मोठा यू-टर्न! जेनसेन हुआंग यांचे दमदार पुनरागमन; संचालक मंडळाचा एकमताने निर्णय, पुन्हा सोपवली सीईओपदाची जबाबदारी", "d": "2026-11-24", "tm": "11:10", "u": "https://cuttocutvideo.com/text-news/nvidia-jensen-huang-reinstated-president-ceo-board-decision", "sec": "ताज्या बातम्या", "img": {"s": "assets/pics/nvidia-jensen-huang-reinstated-president-ceo-400.webp", "m": "assets/pics/nvidia-jensen-huang-reinstated-president-ceo-800.webp"}, "o": "https://cuttocutvideo.com/assets/img/uploads/text-news-images/nvidia-jensen-huang-reinstated-president-ceo-board-decision.png", "b": [{"t": "p", "x": "जागतिक तंत्रज्ञान क्षेत्रातील दिग्गज कंपनी एनव्हिडियाच्या नेतृत्वाबाबत मोठी घडामोड समोर आली आहे. कंपनीने जेनसेन हुआंग यांच्यासंदर्भातील आपल्या पूर्वीच्या निर्णयाचा फेरविचार करत त्यांच्याकडे पुन्हा अध्यक्ष आणि मुख्य कार्यकारी अधिकारी (सीईओ) पदाची जबाबदारी सोपवली आहे. कंपनीच्या संचालक मंडळाने एकमताने हा निर्णय घेतला असून, २३ नोव्हेंबर २०२६ रोजी त्याची घोषणा करण्यात आली. हुआंग यांना संचालक मंडळातही पुन्हा स्थान देण्यात आले आहे."}, {"t": "h", "x": "संचालक मंडळाचा एकमताने निर्णय"}, {"t": "p", "x": "हुआंग यांच्यासोबत अनेक बैठका आणि चर्चा केल्यानंतर संचालक मंडळाने त्यांच्या पुनर्नियुक्तीला मंजुरी दिली. कंपनीचे नेतृत्व करण्याच्या त्यांच्या क्षमतेवर मंडळाने विश्वास व्यक्त केला आहे. भागधारक, कर्मचारी, व्यावसायिक भागीदार आणि ग्राहकांचे हित विचारात घेऊन हा निर्णय घेण्यात आल्याचे संचालक मंडळाचे अध्यक्ष हार्वे सी. जोन्स यांनी स्पष्ट केले."}, {"t": "h", "x": "अमेरिकन सरकारकडूनही माहिती घेण्यात आली"}, {"t": "p", "x": "हुआंग यांची पुनर्नियुक्ती करण्यापूर्वी अमेरिकन सरकारमधील वरिष्ठ पातळीवरून मिळालेल्या माहितीचाही संचालक मंडळाने विचार केला. उपलब्ध माहितीच्या आधारे हुआंग यांच्या पुनरागमनामुळे राष्ट्रीय सुरक्षेला धोका निर्माण होणार नसल्याचा विश्वास मंडळाने व्यक्त केला आहे. हार्वे जोन्स हे मात्र संचालक मंडळाच्या अध्यक्षपदावर कायम राहणार आहेत."}, {"t": "h", "x": "जेनसेन हुआंग यांची भावनिक प्रतिक्रिया"}, {"t": "p", "x": "पुन्हा नेतृत्वाची संधी मिळाल्याबद्दल हुआंग यांनी आनंद व्यक्त केला. नव्या औद्योगिक क्रांतीच्या प्रारंभी एका महत्त्वाच्या तंत्रज्ञान कंपनीचे नेतृत्व करण्याची संधी मिळणे ही सन्मानाची बाब असल्याचे त्यांनी सांगितले. त्यांनी संचालक मंडळ, कर्मचारी, भागधारक, जगभरातील व्यावसायिक सहकारी आणि कुटुंबीयांप्रती कृतज्ञता व्यक्त केली."}, {"t": "h", "x": "कोलेट क्रेस यांच्या कामाचे कौतुक"}, {"t": "p", "x": "हुआंग यांच्या अनुपस्थितीत मुख्य वित्तीय अधिकारी कोलेट क्रेस यांनी प्रभारी सीईओ म्हणूनही काम पाहिले होते. संचालक मंडळाने त्यांच्या योगदानाची दखल घेतली आहे. हुआंग यांच्या पुनरागमनानंतर क्रेस मुख्य वित्तीय अधिकारी म्हणून आपली जबाबदारी पुढेही पार पाडणार आहेत."}, {"t": "h", "x": "स्वतंत्र समितीची चौकशी सुरूच राहणार"}, {"t": "p", "x": "दरम्यान, परदेशी गुप्तचर यंत्रणेच्या प्रयत्नांचे हुआंग लक्ष्य ठरल्यासंदर्भातील वृत्तांनंतर स्थापन करण्यात आलेल्या स्वतंत्र संचालकांच्या समितीची चौकशी सुरूच राहणार आहे. हुआंग यांनी या चौकशीला सहकार्य करण्याची भूमिका घेतली आहे. राष्ट्रीय सुरक्षा आणि निर्यात नियंत्रणासाठीही कंपनीने स्वतंत्र समिती स्थापन केली असून, नियमांच्या अनुपालनावर देखरेख ठेवण्यासाठी नवीन वरिष्ठ अधिकाऱ्याची नियुक्ती करण्याची प्रक्रिया सुरू केली आहे."}]}, {"id": "t8", "k": "text", "slug": "supriya-sule-slams-sharad-pawar-retirement-reports-ncp-nda-alliance", "t": "शरद पवार राजकारणातून निवृत्त होणार? सुप्रिया सुळे संतापल्या; राज्यसभेची अजून पाच वर्षे बाकी असल्याचा दाखला", "d": "2026-11-24", "tm": "11:07", "u": "https://cuttocutvideo.com/text-news/supriya-sule-slams-sharad-pawar-retirement-reports-ncp-nda-alliance", "sec": "ताज्या बातम्या", "img": {"s": "assets/pics/supriya-sule-slams-sharad-pawar-retirement-400.webp", "m": "assets/pics/supriya-sule-slams-sharad-pawar-retirement-800.webp"}, "o": "https://cuttocutvideo.com/assets/img/uploads/text-news-images/supriya-sule-slams-sharad-pawar-retirement-reports-ncp-nda-alliance.png", "b": [{"t": "p", "x": "मुंबई : राष्ट्रवादी काँग्रेस शरदचंद्र पवार पक्षाचे अध्यक्ष शरद पवार यांच्या राजकीय निवृत्तीच्या चर्चांवर खासदार सुप्रिया सुळे यांनी तीव्र नाराजी व्यक्त केली आहे. शरद पवार यांनी राजकारणातून निवृत्त व्हावे आणि त्यांच्या पक्षाने भाजपप्रणित राष्ट्रीय लोकशाही आघाडीत (एनडीए) सहभागी व्हावे, याबाबत पक्षांतर्गत चर्चा सुरू असल्याचे वृत्त समोर आले होते. या वृत्तानंतर महाराष्ट्राच्या राजकीय वर्तुळात विविध चर्चांना उधाण आले. मात्र, सुप्रिया सुळे यांनी शरद पवार निवृत्त होणार नसल्याचे स्पष्ट केले आहे."}, {"t": "h", "x": "शरद पवारांच्या निवृत्तीचा निर्णय जनता घेणार"}, {"t": "p", "x": "लोकप्रतिनिधींच्या राजकीय निवृत्तीचा निर्णय जनतेच्या हातात असल्याची भूमिका सुप्रिया सुळे यांनी मांडली. शरद पवार यांच्या राज्यसभेच्या सदस्यत्वाचा आणखी पाच वर्षांचा कार्यकाळ शिल्लक असताना त्यांच्या निवृत्तीचा प्रश्न उपस्थित करण्याचे कारण काय, असा सवालही त्यांनी केला. पवारांसारख्या ज्येष्ठ नेत्याच्या निवृत्तीविषयी अशा बातम्या प्रसिद्ध होण्याबाबत त्यांनी संताप व्यक्त केला."}, {"t": "h", "x": "राष्ट्रवादीच्या एनडीए प्रवेशाची चर्चा"}, {"t": "p", "x": "शरद पवार यांनी सक्रिय राजकारणातून बाजूला व्हावे आणि सुप्रिया सुळे, जयंत पाटील यांच्यासह पक्षाच्या इतर नेत्यांनी एनडीएमध्ये सहभागी होण्याबाबत निर्णय घ्यावा, अशा पर्यायाची चाचपणी सुरू असल्याचा दावा संबंधित वृत्तात करण्यात आला होता."}, {"t": "p", "x": "पक्षाच्या काही नेत्यांनी भाजप नेतृत्वाशी चर्चाही केल्याचे सूत्रांच्या हवाल्याने सांगण्यात आले आहे. मात्र, यासंदर्भात कोणताही अंतिम निर्णय झालेला नसल्याचेही स्पष्ट करण्यात आले आहे."}, {"t": "h", "x": "शरद पवारांच्या वयाचा दाखला"}, {"t": "p", "x": "येत्या १२ डिसेंबर रोजी शरद पवार वयाची ८६ वर्षे पूर्ण करणार आहेत. सहा दशकांपेक्षा अधिक काळाच्या राजकीय कारकिर्दीत त्यांनी राज्याच्या मुख्यमंत्रिपदासह केंद्रातील विविध महत्त्वपूर्ण जबाबदाऱ्या सांभाळल्या आहेत. त्यांच्या पूर्वीच्या राजकीय भूमिकेच्या पार्श्वभूमीवर भाजपसोबत जाण्याचा निर्णय घेण्याऐवजी त्यांनी निवृत्त व्हावे, अशा पर्यायाची चर्चा असल्याचा दावा करण्यात आला होता."}, {"t": "h", "x": "संजय राऊत यांचाही संताप"}, {"t": "p", "x": "शिवसेना उद्धव बाळासाहेब ठाकरे पक्षाचे खासदार संजय राऊत यांनीही निवृत्तीच्या वृत्तावर नाराजी व्यक्त केली. शरद पवार यांची राजकीय कारकीर्द धर्मांध शक्तींना विरोध करण्यात आणि शाहू, फुले, आंबेडकर यांच्या विचारांसाठी काम करण्यात गेल्याचे त्यांनी सांगितले. सत्तेसाठी या विचारांशी तडजोड करणे अयोग्य असल्याची भूमिका मांडत सुप्रिया सुळे एनडीएमध्ये सहभागी होतील, असे वाटत नसल्याचेही राऊत म्हणाले."}, {"t": "h", "x": "नरेंद्र मोदींच्या फोनची पुन्हा चर्चा"}, {"t": "p", "x": "दुष्काळग्रस्त भागांच्या दौऱ्यादरम्यान पवारांची प्रकृती बिघडल्याने त्यांना पुण्यात आणि त्यानंतर मुंबईत उपचारांसाठी दाखल करण्यात आले होते. त्यावेळी पंतप्रधान नरेंद्र मोदी यांनी दूरध्वनीवरून त्यांच्या प्रकृतीची विचारपूस केली होती. मोदींनी पवारांना विश्रांती घेण्याचा सल्ला दिल्याने त्याचे राजकीय अर्थही काढण्यात आले होते."}, {"t": "p", "x": "मात्र, सुप्रिया सुळे यांच्या ताज्या प्रतिक्रियेनंतर पवारांच्या निवृत्तीबाबतच्या चर्चांना नवे वळण मिळाले आहे. राष्ट्रवादी काँग्रेस शरदचंद्र पवार पक्षाच्या एनडीए प्रवेशाबाबतही अद्याप अधिकृत निर्णय झालेला नाही."}]}, {"id": "t9", "k": "text", "slug": "satej-patil-slams-mahayuti-government-dpdc-fund-allocation-gokul-election-kolhapur", "t": "डीपीसी, जिल्हा परिषदाच रद्द करा! निधीवाटपावरून सतेज पाटील संतापले; चंद्रकांत पाटील, हसन मुश्रीफांवरही निशाणा", "d": "2026-11-24", "tm": "11:04", "u": "https://cuttocutvideo.com/text-news/satej-patil-slams-mahayuti-government-dpdc-fund-allocation-gokul-election-kolhapur", "sec": "ताज्या बातम्या", "img": {"s": "assets/pics/satej-patil-slams-mahayuti-government-dpdc-400.webp", "m": "assets/pics/satej-patil-slams-mahayuti-government-dpdc-800.webp"}, "o": "https://cuttocutvideo.com/assets/img/uploads/text-news-images/satej-patil-slams-mahayuti-government-dpdc-fund-allocation-gokul-election-kolhapur.png", "b": [{"t": "p", "x": "कोल्हापूर : जिल्हा नियोजन समितीच्या निधीवाटपावरून काँग्रेस आमदार सतेज पाटील यांनी महायुती सरकारवर जोरदार टीका केली आहे. जिल्हा परिषदेच्या सदस्यांना मिळणाऱ्या विकासनिधीत आमदार, खासदार आणि मंत्र्यांनी हिस्सा का मागावा, असा सवाल त्यांनी उपस्थित केला. निधीवाटपाचे सर्व अधिकार राज्य सरकारलाच हवे असतील, तर जिल्हा नियोजन समित्या आणि जिल्हा परिषदा रद्द कराव्यात, अशी उपरोधिक प्रतिक्रिया त्यांनी मंगळवारी कोल्हापुरातील पत्रकार परिषदेत दिली."}, {"t": "h", "x": "निधीवाटपाच्या प्रस्तावाला सत्ताधाऱ्यांचाही विरोध"}, {"t": "p", "x": "पालकमंत्र्यांनी सांगितलेल्या ७०:३० निधीवाटपाच्या सूत्राला विरोधकांच्या १७ जिल्हा परिषद सदस्यांसह सत्ताधारी गटातील ३० सदस्यांनीही विरोध दर्शविल्याचा दावा सतेज पाटील यांनी केला. त्यामुळे निधीवाटपावरून सत्ताधाऱ्यांमध्येही मतभेद असल्याचे त्यांनी सूचित केले."}, {"t": "p", "x": "जिल्हा परिषद सदस्यांकडून होणारी विकासकामे संबंधित विधानसभा मतदारसंघातच होणार आहेत. त्यामुळे त्यांच्या निधीमध्ये आमदारांनी वाटा मागण्याची आवश्यकता काय, असा प्रश्न पाटील यांनी उपस्थित केला."}, {"t": "h", "x": "स्थानिक नियोजनाच्या अधिकारांचा मुद्दा ऐरणीवर"}, {"t": "p", "x": "जिल्हास्तरावर विकासकामांचे नियोजन करण्यासाठी जिल्हा नियोजन समित्यांची स्थापना करण्यात आली आहे. मात्र, निधी कसा खर्च करायचा, याबाबतचे निर्णय राज्य सरकारच घेणार असेल, तर या व्यवस्थेच्या अस्तित्वाला काय अर्थ उरतो, अशी भूमिका सतेज पाटील यांनी मांडली."}, {"t": "p", "x": "राज्याचा अर्थसंकल्प आणि इतर निधीवाटपाचे अधिकार सरकारकडे असतानाही जिल्हा नियोजन समितीच्या निधीवर लोकप्रतिनिधींनी स्वतंत्र हक्क सांगण्याबाबत त्यांनी आक्षेप घेतला."}, {"t": "h", "x": "चंद्रकांत पाटलांच्या समर्थकांना प्रत्युत्तर"}, {"t": "p", "x": "गोकुळ निवडणुकीनंतर चंद्रकांत पाटील यांच्या समर्थकांनी लावलेल्या बॅनर्सवरही सतेज पाटील यांनी भाष्य केले. चंद्रकांत पाटील यांची राजकीय कार्यपद्धती आपल्यासह कोल्हापूरकरांना आणि महाराष्ट्रालाही समजली असल्याचा टोला त्यांनी लगावला."}, {"t": "h", "x": "गोकुळच्या कारभारावरून मुश्रीफ आणि चंद्रकांत पाटील लक्ष्य"}, {"t": "p", "x": "गोकुळच्या अध्यक्षपदाच्या निवडीसाठी निर्माण झालेली कोंडी कृत्रिम असल्याचा आरोप सतेज पाटील यांनी केला. महायुतीचे १२ संचालक उपस्थित राहिले असते, तर आवश्यक गणपूर्ती झाली असती, असे त्यांनी सांगितले."}, {"t": "p", "x": "चार शासननियुक्त संचालकांच्या नियुक्तीमागे चंद्रकांत पाटील आणि हसन मुश्रीफ यांचा आग्रह असल्याचा आरोपही त्यांनी केला. संबंधित कायद्यातील बदलाला सत्ताधारी पक्षातील अनेकांचाही विरोध होता, असा दावा त्यांनी केला आहे."}, {"t": "p", "x": "निधीवाटप आणि गोकुळमधील शासनाच्या हस्तक्षेपावरून सतेज पाटील यांनी महायुतीसमोर पुन्हा राजकीय आव्हान उभे केले आहे."}]}, {"id": "t10", "k": "text", "slug": "supreme-court-of-india-and-election-commission-amid-a-petition-seeking-anti-defection-law-reforms", "t": "राजीनामा देऊन पक्षांतरबंदी कायद्यातून पळवाट काढणे बंद होणार? सर्वोच्च न्यायालयाची केंद्र सरकारसह निवडणूक आयोगाला नोटीस", "d": "2026-11-24", "tm": "10:53", "u": "https://cuttocutvideo.com/text-news/supreme-court-of-india-and-election-commission-amid-a-petition-seeking-anti-defection-law-reforms", "sec": "ताज्या बातम्या", "img": {"s": "assets/pics/supreme-court-of-india-and-election-400.webp", "m": "assets/pics/supreme-court-of-india-and-election-800.webp"}, "o": "https://cuttocutvideo.com/assets/img/uploads/text-news-images/supreme-court-of-india-and-election-commission-amid-a-petition-seeking-anti-defection-law-reforms.png", "b": [{"t": "p", "x": "नवी दिल्ली : देशातील राजकीय पक्षांतराला आळा घालण्यासाठी पक्षांतरबंदी कायद्यात व्यापक बदल करण्याची मागणी करणारी जनहित याचिका सर्वोच्च न्यायालयात दाखल झाली आहे. या याचिकेची दखल घेत सर्वोच्च न्यायालयाने केंद्र सरकार, भारतीय निवडणूक आयोग आणि विधी आयोगाला नोटीस बजावली आहे. अपात्रतेची कारवाई टाळण्यासाठी लोकप्रतिनिधींकडून दिले जाणारे राजीनामे आणि त्यानंतर होणारे पक्षांतर, यावर याचिकेत प्रामुख्याने प्रश्न उपस्थित करण्यात आले आहेत."}, {"t": "p", "x": "सरन्यायाधीश सूर्यकांत, न्यायमूर्ती जॉयमाल्य बागची आणि न्यायमूर्ती व्ही. मोहना यांच्या खंडपीठासमोर या जनहित याचिकेवर सुनावणी झाली. ए. सेथू यांनी दाखल केलेल्या या याचिकेची बाजू आर. सतीश कुमार आणि जतीन यांनी मांडली."}, {"t": "h", "x": "राजीनाम्याच्या माध्यमातून अपात्रता टाळण्यावर आक्षेप"}, {"t": "p", "x": "अपात्रतेसंबंधी निर्णय होण्याआधीच आमदार किंवा खासदारांनी राजीनामा दिल्यास संबंधित कारवाईचे भवितव्य काय असावे, हा याचिकेतील प्रमुख मुद्दा आहे. संबंधित सदस्यांना दुसऱ्या पक्षातून पुन्हा निवडणूक लढवण्याची संधी मिळत असल्याने पक्षांतरबंदी कायद्याच्या परिणामकारकतेवर प्रश्न उपस्थित करण्यात आला आहे."}, {"t": "p", "x": "याचिकाकर्त्यांच्या मते, राजीनामा आणि अपात्रता या प्रक्रिया परस्परांपासून पूर्णपणे वेगळ्या मानल्यास कायद्याच्या मूळ हेतूला बाधा पोहोचू शकते. त्यामुळे राजीनामा दिल्याने प्रलंबित अपात्रता प्रक्रिया संपुष्टात येऊ नये, अशी मागणी करण्यात आली आहे."}, {"t": "h", "x": "राजीनाम्यामागील कारणांची तपासणी करण्याची मागणी"}, {"t": "p", "x": "लोकप्रतिनिधीचा राजीनामा हा स्वेच्छेने घेतलेला निर्णय आहे की त्यामागे राजकीय दबाव अथवा लाभ मिळवण्याचा उद्देश आहे, याची पडताळणी करण्याची मागणी याचिकेत आहे."}, {"t": "p", "x": "यामुळे राजीनाम्याच्या वैधतेचा प्रश्न आणि संबंधित लोकप्रतिनिधीच्या अपात्रतेचा प्रश्न या दोन्ही बाबी विचारात घेण्याची आवश्यकता अधोरेखित करण्यात आली आहे."}, {"t": "h", "x": "विधानसभा अध्यक्षांच्या निर्णयाधिकाराचे पुनरावलोकन करण्याची मागणी"}, {"t": "p", "x": "राजीनामे आणि अपात्रता याचिकांवर निर्णय घेण्यासाठी निश्चित कालमर्यादा असावी, अशी मागणी करण्यात आली आहे. त्याचबरोबर विधानसभा अध्यक्ष आणि सभापती यांच्या अधिकारांतर्गत चालणाऱ्या अपात्रता निर्णयप्रक्रियेचे संस्थात्मक पुनरावलोकन करण्याचाही मुद्दा उपस्थित करण्यात आला आहे."}, {"t": "h", "x": "बहुमत चाचणीच्य /* ---------- the page's own little script (runs inside each design page) ---------- */
function pageScript(OPT, RAW, IDX) {
  var fileMode = /^file:/i.test(document.baseURI);
  var toastEl = document.querySelector('.toast'), tt;
  function toast(t) { toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { toastEl.classList.remove('on'); }, 2800); }
  function go(msg) {
    if (RAW) {
      var q = new URLSearchParams(location.search); q.set('raw', '1'); q.set('o', OPT);
      if (msg.story) { q.set('v', 'story'); q.set('s', msg.story); } else { q.set('v', 'home'); q.delete('s'); }
      location.search = q.toString(); return;
    }
    parent.postMessage(msg, '*');
  }
  function ytUrl(id, short) { return 'https://www.youtube.com/' + (short ? 'shorts/' : 'watch?v=') + id; }
  function frame(id, title) {
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1';
    f.title = title || 'YouTube'; f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    return f;
  }
  function play(box) {
    var id = box.getAttribute('data-play');
    if (fileMode) { window.open(ytUrl(id, false), '_blank', 'noopener'); toast('व्हिडिओ YouTube वर उघडला'); return; }
    box.classList.add('on'); box.removeAttribute('role'); box.innerHTML = ''; box.appendChild(frame(id, box.getAttribute('data-title')));
  }
  var ov;
  function closeShort() { if (!ov) return; ov.classList.remove('on'); ov.querySelector('.sfr').innerHTML = ''; document.documentElement.style.overflow = ''; }
  function openShort(id, title, url) {
    if (fileMode) { window.open(ytUrl(id, true), '_blank', 'noopener'); toast('व्हिडिओ YouTube वर उघडला'); return; }
    if (!ov) {
      ov = document.createElement('div'); ov.className = 'sov';
      ov.innerHTML = '<div class="sbox"><button class="sx" type="button" aria-label="बंद करा">✕</button><div class="sfr"></div><p class="st"></p><a class="swa" target="_blank" rel="noopener">WhatsApp वर शेअर करा</a></div>';
      document.body.appendChild(ov);
      ov.addEventListener('click', function (e) { if (e.target === ov || e.target.closest('.sx')) closeShort(); });
    }
    ov.querySelector('.sfr').innerHTML = ''; ov.querySelector('.sfr').appendChild(frame(id, title));
    ov.querySelector('.st').textContent = title;
    ov.querySelector('.swa').href = 'https://wa.me/?text=' + encodeURIComponent(title + ' ' + url);
    ov.classList.add('on'); document.documentElement.style.overflow = 'hidden';
  }
  var sr;
  function closeSearch() { if (sr) sr.classList.remove('on'); }
  function openSearch() {
    if (!sr) {
      sr = document.createElement('div'); sr.className = 'srch';
      sr.innerHTML = '<div class="sp2" role="dialog" aria-label="बातमी शोधा"><label><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M15.5 15.5L21 21"/></svg><input type="search" placeholder="बातमी शोधा… (उदा. फडणवीस)" aria-label="बातमी शोधा"></label><div class="res"></div></div>';
      document.body.appendChild(sr);
      var inp = sr.querySelector('input'), res = sr.querySelector('.res');
      inp.addEventListener('input', function () {
        var q = inp.value.trim().toLowerCase();
        if (!q) { res.innerHTML = ''; return; }
        var hits = IDX.filter(function (r) { return r[1].toLowerCase().indexOf(q) >= 0; }).slice(0, 8);
        res.innerHTML = hits.length ? hits.map(function (r) { return '<a href="' + r[3] + '" data-id="' + r[0] + '">' + r[1].replace(/[&<>]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]; }) + '<small>' + r[2] + '</small></a>'; }).join('') : '<p>काहीही सापडले नाही</p>';
      });
      sr.addEventListener('click', function (e) { if (e.target === sr) closeSearch(); });
    }
    sr.classList.add('on'); setTimeout(function () { sr.querySelector('input').focus(); }, 30);
  }
  function fitLists() {
    document.querySelectorAll('[data-fit] ol').forEach(function (ol) {
      var items = [].slice.call(ol.children);
      items.forEach(function (li) { li.classList.remove('cut'); });
      if (getComputedStyle(ol).overflowY !== 'hidden') return;
      for (var i = items.length - 1; i >= 0 && ol.scrollHeight > ol.clientHeight + 1; i--) items[i].classList.add('cut');
      items.forEach(function (li, i) { if (li.classList.contains('day')) { var n = items[i + 1]; if (!n || n.classList.contains('cut') || n.classList.contains('day')) li.classList.add('cut'); } });
    });
  }
  fitLists();
  if (document.fonts) document.fonts.ready.then(fitLists);
  window.addEventListener('load', fitLists);
  window.addEventListener('resize', fitLists);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeShort(); closeSearch(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-play]')) { e.preventDefault(); play(e.target); }
  });
  document.addEventListener('click', function (e) {
    var t = e.target;
    var p = t.closest('[data-play]'); if (p) { e.preventDefault(); play(p); return; }
    var s = t.closest('[data-short]'); if (s) { e.preventDefault(); openShort(s.getAttribute('data-short'), s.getAttribute('data-title'), s.href); return; }
    var c = t.closest('[data-copy]'); if (c) { e.preventDefault(); try { navigator.clipboard.writeText(c.getAttribute('data-copy')).catch(function () {}); } catch (er) { /* not offered */ } toast('लिंक कॉपी झाली'); return; }
    if (t.closest('[data-search]')) { e.preventDefault(); openSearch(); return; }
    var sc = t.closest('[data-scroll]'); if (sc) { var rs = sc.closest('.row').querySelector('.rs'); rs.scrollBy({left: (+sc.getAttribute('data-scroll')) * rs.clientWidth * 0.9, behavior: 'smooth'}); return; }
    var a = t.closest('a'); if (!a) return;
    if (a.target === '_blank' || /^(mailto|tel):/.test(a.getAttribute('href') || '')) return; /* YouTube, Facebook, share and contact links work as they are */
    e.preventDefault();
    var st = t.closest('[data-id]'); if (st) { closeSearch(); go({story: st.getAttribute('data-id')}); return; }
    var k = a.getAttribute('data-sec');
    if (k === 'home') { if (document.body.classList.contains('home-page')) window.scrollTo({top: 0, behavior: 'smooth'}); else go({home: 1}); return; }
    var target = k && document.getElementById('sec-' + k);
    if (target) { target.scrollIntoView({behavior: 'smooth', block: 'start'}); return; }
    if (k && !document.body.classList.contains('home-page')) { go({home: 1}); return; }
    toast('हे पान पूर्वावलोकनात नाही');
  });
}

/* ---------- one page of one option, as a whole HTML document ---------- */
const MODE = {1: 'light', 2: 'dark', 3: 'light'}; /* each option's own default */
function pageDoc(o, v, id, raw, mode) {
  mode = mode || MODE[o];
  const opt = O[o];
  const x = I[id] || I[D.story];
  const story = v === 'story';
  const bodyHtml = story ? opt.story(x) : opt.home();
  const title = story ? esc(x.t) + ' | कट TO कट' : 'कट TO कट | ' + TAG;
  const url = story ? x.u : SITE;
  const pic = !story ? 'https://cuttocutvideo.com/assets/img/logo/og-image.jpg' : x.k === 'text' ? x.o : `https://i.ytimg.com/vi/${x.yt}/maxresdefault.jpg`;
  const desc = story ? esc(lede(x, 155) || x.t) : 'कट TO कट - ' + DESC;
  const ld = story ? {
    '@context': 'https://schema.org', '@type': 'NewsArticle', headline: x.t, inLanguage: 'mr', mainEntityOfPage: x.u,
    datePublished: x.d + (x.tm ? 'T' + x.tm + ':00+05:30' : ''), image: [pic],
    author: {'@type': 'Organization', name: 'कट TO कट', url: SITE},
    publisher: {'@type': 'Organization', name: 'कट TO कट', logo: {'@type': 'ImageObject', url: 'https://cuttocutvideo.com/assets/img/logo/logo.png'}},
    ...(x.yt ? {video: {'@type': 'VideoObject', name: x.t, thumbnailUrl: pic, embedUrl: 'https://www.youtube.com/embed/' + x.yt, uploadDate: x.d}} : {})
  } : {'@context': 'https://schema.org', '@type': 'NewsMediaOrganization', name: 'कट TO कट', url: SITE, logo: 'https://cuttocutvideo.com/assets/img/logo/logo.png', sameAs: [SOC.yt, SOC.fb, SOC.ig]};
  const idx = D.items.filter(i => i.k !== 'short').map(i => [i.id, i.t, (i.d ? dDay(i.d) : '') + ' · ' + i.sec, i.u]);
  return `<!doctype html><html lang="mr" data-theme="${mode}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">` +
    `<title>${title}</title><meta name="description" content="${desc}"><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">` +
    `<link rel="canonical" href="${url}"><meta property="og:type" content="${story ? 'article' : 'website'}"><meta property="og:site_name" content="कट TO कट"><meta property="og:locale" content="mr_IN">` +
    `<meta property="og:title" content="${story ? esc(x.t) : 'कट TO कट | ' + TAG}"><meta property="og:url" content="${url}"><meta property="og:image" content="${pic}">` +
    `<meta property="og:image:width" content="${!story ? 1200 : x.k === 'text' ? 1600 : 1280}"><meta property="og:image:height" content="${!story ? 630 : x.k === 'text' ? 900 : 720}"><meta name="twitter:card" content="summary_large_image">` +
    `<meta name="theme-color" content="${o === 2 ? '#a00d12' : o === 1 ? (mode === 'dark' ? '#b80000' : '#d00000') : (mode === 'dark' ? '#141416' : '#ffffff')}">` +
    `<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://i.ytimg.com">` +
    `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?${opt.fonts}&display=swap">` +
    `<style>${BASE}${opt.css}</style><script type="application/ld+json">${JSON.stringify(ld).replace(/</g, '\\u003c')}<\/script></head>` +
    `<body class="${story ? 'story-page' : 'home-page'} o${o}">${bodyHtml}<div class="toast" role="status" aria-live="polite"></div>` +
    `<script>(${pageScript.toString()})(${o},${raw ? 1 : 0},${JSON.stringify(idx).replace(/</g, '\\u003c')});<\/script></body></html>`;
}

/* ---------- the switcher ---------- */
const st = {o: 1, v: 'home', w: 'desk', s: D.story, m: ''};
const q = new URLSearchParams(location.search);
for (const k of ['o', 'v', 'w', 's', 'm']) if (q.get(k)) st[k] = k === 'o' ? +q.get(k) : q.get(k);
const modeNow = () => st.m || MODE[st.o];

if (q.get('raw')) {
  /* one page alone, at the window's own width (used by the checks, and to look at a design full-screen) */
  window.addEventListener('DOMContentLoaded', () => { const h = pageDoc(st.o, st.v, st.s, true, modeNow()); document.open(); document.write(h); document.close(); });
} else {
  const M = D.measure;
  const kb = n => n >= 1024 ? (n / 1024).toFixed(1) + ' MB' : n + ' KB';
  document.getElementById('when').textContent = `Design preview by Both Sides, not the live website · your real stories as of ${new Date(D.today + 'T12:00:00Z').toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric'})} (fetched ${D.fetched.slice(11, 16)} IST): ${L.latest.length} written stories, ${D.items.filter(i => i.k === 'video').length} video stories, ${L.feed.length} YouTube uploads, ${L.shorts.length} Shorts`;
  document.getElementById('opt').innerHTML = [1, 2, 3].map(n => `<button data-o="${n}">Option ${n}</button>`).join('');
  if (/^file:/i.test(location.href)) document.getElementById('filenote').style.display = 'block';
  document.getElementById('notes').innerHTML = `
